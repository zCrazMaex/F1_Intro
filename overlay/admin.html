<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>F1 Grid Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0f; color: #fff; font-family: 'Arial', sans-serif; padding: 20px; }
    h1 { color: #e10600; margin-bottom: 20px; font-size: 1.5rem; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    input[type="text"] { background: #1a1a2e; border: 1px solid #333; color: #fff; padding: 6px 10px; border-radius: 4px; width: 100%; }
    .race-input { margin-bottom: 20px; }
    .race-input label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.85rem; }
    .race-input input { max-width: 400px; font-size: 1rem; padding: 8px 12px; }
    .grid-table { width: 100%; border-collapse: collapse; }
    .grid-table th { background: #e10600; padding: 8px 12px; text-align: left; font-size: 0.8rem; letter-spacing: 1px; }
    .grid-table td { padding: 6px 8px; border-bottom: 1px solid #1a1a1a; }
    .grid-table tr:hover td { background: #1a1a2e; }
    .pos { color: #e10600; font-weight: bold; width: 40px; text-align: center; }
    .btn { padding: 10px 24px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: all 0.2s; }
    .btn-primary { background: #e10600; color: #fff; }
    .btn-primary:hover { background: #ff1e00; }
    .btn-secondary { background: #333; color: #fff; margin-right: 10px; }
    .status { padding: 10px 15px; border-radius: 4px; margin-top: 15px; display: none; }
    .status.success { background: #1a3a1a; border: 1px solid #2a6a2a; color: #4caf50; display: block; }
    .status.error { background: #3a1a1a; border: 1px solid #6a2a2a; color: #f44336; display: block; }
    .preview-img { width: 30px; height: 40px; object-fit: cover; border-radius: 3px; vertical-align: middle; }
    .divider { background: #e10600; height: 2px; margin: 8px 0; }
    .p10-divider td { border-top: 2px solid #e10600 !important; }
    select { background: #1a1a2e; border: 1px solid #333; color: #fff; padding: 5px 8px; border-radius: 4px; }
  </style>
</head>
<body>

<h1>🏎️ F1 GRID MANAGER</h1>

<div class="race-input">
  <label>RENNEN</label>
  <input type="text" id="raceName" placeholder="z.B. Monaco GP 2026">
</div>

<div class="header">
  <div>
    <button class="btn btn-secondary" onclick="loadGrid()">↺ Laden</button>
    <button class="btn btn-primary" onclick="saveGrid()">💾 Speichern & Live</button>
  </div>
  <span id="lastSaved" style="color:#666; font-size:0.8rem;"></span>
</div>

<table class="grid-table">
  <thead>
    <tr>
      <th>P</th>
      <th>NAME</th>
      <th>TEAM</th>
      <th>NR</th>
      <th>ASSET KEY</th>
      <th>VORSCHAU</th>
    </tr>
  </thead>
  <tbody id="gridBody"></tbody>
</table>

<div id="statusMsg" class="status"></div>

<script>
// ⚠️ DEINE RENDER API URL HIER EINTRAGEN
const API_URL = 'https://f1-intro-api.onrender.com';
const GITHUB_RAW = 'https://github.com/zCrazMaex/F1_Intro/main/assets/drivers';

let gridData = null;
let lastUpdatedAt = null;
let revealInterval = null;

// ── Grid laden & auf Änderungen prüfen ──
async function checkForUpdates() {
  try {
    const res = await fetch(`${API_URL}/api/grid?t=${Date.now()}`);
    const newData = await res.json();

    // Nur neu starten wenn sich updatedAt geändert hat
    if (newData.updatedAt !== lastUpdatedAt) {
      console.log('Neues Grid erkannt, starte Overlay neu...');
      lastUpdatedAt = newData.updatedAt;
      gridData = newData;
      restartOverlay();
    }
  } catch (err) {
    console.error('Fehler beim Laden:', err);
  }
}

// ── Overlay komplett neu aufbauen & Animation starten ──
function restartOverlay() {
  // Laufende Animation stoppen
  if (revealInterval) {
    clearInterval(revealInterval);
    revealInterval = null;
  }

  // Titel setzen
  const title = document.getElementById('race-title');
  title.textContent = gridData.race;
  title.classList.add('visible');

  // Overlay neu aufbauen
  buildOverlay();

  // Animation nach kurzer Pause starten
  setTimeout(startReveal, 1000);
}

// ── Overlay aufbauen ──
function buildOverlay() {
  const overlay = document.getElementById('grid-overlay');
  overlay.innerHTML = '';

  const bottomSection = createSection('P22 – P11', gridData.drivers.slice(10, 22).reverse());
  overlay.appendChild(bottomSection);

  const divider = document.createElement('div');
  divider.style.cssText = 'width:1800px; height:2px; background:#e10600; margin:10px 0; opacity:0.4;';
  overlay.appendChild(divider);

  const topSection = createSection('TOP 10', gridData.drivers.slice(0, 10).reverse());
  overlay.appendChild(topSection);
}

function createSection(label, drivers) {
  const section = document.createElement('div');
  section.className = 'section';

  const lbl = document.createElement('div');
  lbl.className = 'section-label';
  lbl.textContent = label;
  section.appendChild(lbl);

  drivers.forEach(driver => {
    section.appendChild(createDriverRow(driver));
  });

  return section;
}

function createDriverRow(driver) {
  const row = document.createElement('div');
  row.className = 'driver-row';
  row.id = `driver-p${driver.position}`;

  const assetBase = `${GITHUB_RAW}/${driver.assetKey}`;

  row.innerHTML = `
    <div class="position-box">P${driver.position}</div>
    <div class="driver-info driver-animated">
      <video class="driver-video" autoplay muted loop playsinline>
        <source src="${assetBase}/video.mp4" type="video/mp4">
      </video>
      <span class="driver-number">#${driver.number}</span>
      <div>
        <div class="driver-name">${driver.name}</div>
        <div class="driver-team">${driver.team}</div>
      </div>
      <img class="driver-portrait"
           src="${assetBase}/portrait.png"
           onerror="this.src='https://placehold.co/80x90/1a1a2e/e10600?text=${driver.number}'"
           alt="${driver.name}">
    </div>
  `;

  return row;
}

// ── Reveal Animation ──
function startReveal() {
  const bottomOrder = [];
  for (let i = 22; i >= 11; i -= 2) bottomOrder.push([i, i - 1]);

  const topOrder = [];
  for (let i = 10; i >= 1; i -= 2) topOrder.push([i, i - 1]);

  const allSteps = [...bottomOrder, null, ...topOrder]; // null = Pause
  let step = 0;

  revealInterval = setInterval(() => {
    if (step >= allSteps.length) {
      clearInterval(revealInterval);
      revealInterval = null;
      return;
    }

    const current = allSteps[step];
    step++;

    if (current === null) return; // Pause überspringen (1 Tick = 2s)

    current.forEach(pos => {
      const el = document.getElementById(`driver-p${pos}`);
      if (el) {
        el.classList.add('reveal');
        const video = el.querySelector('video');
        if (video) video.play();
      }
    });

  }, 2000);
}

// ── Start + alle 5 Sekunden auf Updates prüfen ──
checkForUpdates();
setInterval(checkForUpdates, 5000);
  
</script>
</body>
</html>
