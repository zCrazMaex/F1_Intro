<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>F1 Grid Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0f; color: #fff; font-family: Arial, sans-serif; padding: 20px; }

    h2 { color: #e10600; font-size: 1.1rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 14px; }

    /* ── SECTION ── */
    .section { margin-bottom: 30px; }

    /* ── RACE INPUT ── */
    .race-input { margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
    .race-input label { color: #aaa; font-size: 0.85rem; white-space: nowrap; }
    .race-input input { background: #1a1a2e; border: 1px solid #333; color: #fff; padding: 8px 12px; border-radius: 4px; font-size: 1rem; width: 300px; }

    /* ── PARTICIPANTS GRID ── */
    #participants-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 10px;
    }

    .participant-slot {
      background: #111120;
      border: 1px solid #222;
      border-radius: 4px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .participant-slot .slot-num {
      color: #e10600;
      font-weight: bold;
      font-size: 0.85rem;
      width: 20px;
      flex-shrink: 0;
    }

    .participant-slot select {
      background: #1a1a2e;
      border: 1px solid #333;
      color: #fff;
      padding: 5px 8px;
      border-radius: 4px;
      flex: 1;
      font-size: 0.85rem;
    }

    .participant-slot .team-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #333;
    }

    /* ── BUTTONS ── */
    .btn { padding: 10px 24px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: all 0.2s; }
    .btn-primary { background: #e10600; color: #fff; }
    .btn-primary:hover { background: #ff1e00; }
    .btn-secondary { background: #333; color: #fff; }
    .btn-secondary:hover { background: #444; }
    .btn-row { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }

    /* ── GRID TABLE ── */
    .grid-table { width: 100%; border-collapse: collapse; }
    .grid-table th { background: #e10600; padding: 8px 12px; text-align: left; font-size: 0.8rem; letter-spacing: 1px; }
    .grid-table td { padding: 6px 8px; border-bottom: 1px solid #1a1a1a; }
    .grid-table tr:hover td { background: #1a1a2e; }
    .pos { color: #e10600; font-weight: bold; width: 40px; text-align: center; }

    select { background: #1a1a2e; border: 1px solid #333; color: #fff; padding: 5px 8px; border-radius: 4px; width: 100%; }

    .preview-img { width: 30px; height: 40px; object-fit: cover; border-radius: 3px; vertical-align: middle; }

    .status { padding: 10px 15px; border-radius: 4px; margin-top: 15px; display: none; }
    .status.success { background: #1a3a1a; border: 1px solid #2a6a2a; color: #4caf50; display: block; }
    .status.error   { background: #3a1a1a; border: 1px solid #6a2a2a; color: #f44336; display: block; }

    #lastSaved { color: #666; font-size: 0.8rem; }

    .divider { height: 1px; background: #222; margin: 24px 0; }
  </style>
</head>
<body>

<div class="race-input">
  <label>RENNEN</label>
  <input type="text" id="raceName" placeholder="z.B. Monaco GP 2026">
</div>

<!-- ── SECTION 1: TEILNEHMER ── -->
<div class="section">
  <h2>① Teilnehmer (wer fährt heute)</h2>
  <div id="participants-grid"></div>
</div>

<div class="divider"></div>

<!-- ── SECTION 2: STARTAUFSTELLUNG ── -->
<div class="section">
  <h2>② Startaufstellung</h2>
  <div class="btn-row">
    <button class="btn btn-secondary" onclick="loadGrid()">↺ Laden</button>
    <button class="btn btn-primary" onclick="saveGrid()">💾 Speichern &amp; Live</button>
    <span id="lastSaved"></span>
  </div>

  <table class="grid-table">
    <thead>
      <tr>
        <th>P</th>
        <th>FAHRER</th>
        <th>TEAM</th>
        <th>NR</th>
        <th>ASSET KEY</th>
        <th>VORSCHAU</th>
      </tr>
    </thead>
    <tbody id="gridBody"></tbody>
  </table>
</div>

<div id="statusMsg" class="status"></div>

<script>
const API_URL          = 'https://f1-intro-api.onrender.com';
const GITHUB_RAW_TEAMS = 'https://raw.githubusercontent.com/zCrazMaex/F1_Intro/main/assets/teams';

let ALL_DRIVERS = [];

async function loadDriverPool() {
  try {
    const res  = await fetch(`${API_URL}/api/drivers`);
    const data = await res.json();
    ALL_DRIVERS = data.drivers || [];
  } catch(e) {
    console.error('Fahrer-Pool konnte nicht geladen werden:', e);
  }
}

const TEAM_COLORS = {
  'Red Bull Racing': '#3671C6',
  'McLaren':         '#FF8000',
  'Ferrari':         '#E8002D',
  'Mercedes':        '#27F4D2',
  'Aston Martin':    '#229971',
  'Alpine':          '#FF87BC',
  'Audi':            '#C92D4B',
  'Williams':        '#64C4FF',
  'VCARB':           '#6692FF',
  'Haas':            '#B6BABD',
  'Cadillac':        '#CC1E4A',
};

const TEAM_LOGOS = {
  'Red Bull Racing': `${GITHUB_RAW_TEAMS}/redbull.png`,
  'McLaren':         `${GITHUB_RAW_TEAMS}/mclaren.png`,
  'Ferrari':         `${GITHUB_RAW_TEAMS}/ferrari.png`,
  'Mercedes':        `${GITHUB_RAW_TEAMS}/mercedes.png`,
  'Aston Martin':    `${GITHUB_RAW_TEAMS}/astonmartin.png`,
  'Alpine':          `${GITHUB_RAW_TEAMS}/alpine.png`,
  'Audi':            `${GITHUB_RAW_TEAMS}/audi.png`,
  'Williams':        `${GITHUB_RAW_TEAMS}/williams.png`,
  'VCARB':           `${GITHUB_RAW_TEAMS}/vcarb.png`,
  'Haas':            `${GITHUB_RAW_TEAMS}/haas.png`,
  'Cadillac':        `${GITHUB_RAW_TEAMS}/cadillac.png`,
};


let participants = Array(22).fill(null); // 22 Teilnehmer-Slots
let currentGrid  = [];                   // Startaufstellung

// ── TEILNEHMER SEKTION AUFBAUEN ──
function buildParticipantsUI() {
  const container = document.getElementById('participants-grid');
  container.innerHTML = '';

  for (let i = 0; i < 22; i++) {
    const slot = document.createElement('div');
    slot.className = 'participant-slot';

    const dot = document.createElement('div');
    dot.className = 'team-dot';
    dot.id = `pdot-${i}`;

    const num = document.createElement('span');
    num.className = 'slot-num';
    num.textContent = `${i+1}.`;

    const sel = document.createElement('select');
    sel.id = `participant-${i}`;
    sel.innerHTML = `<option value="">— Fahrer wählen —</option>`;
    ALL_DRIVERS.forEach(d => {
      sel.innerHTML += `<option value="${d.assetKey}">${d.name} (${d.team})</option>`;
    });

    // Beim Ändern: dot-Farbe updaten + Startaufstellung-Dropdowns neu befüllen
    sel.addEventListener('change', () => {
      updateParticipants();
      updateGridDropdowns();
    });

    slot.appendChild(num);
    slot.appendChild(dot);
    slot.appendChild(sel);
    container.appendChild(slot);
  }
}

// Teilnehmer-Array aus Dropdowns lesen + Dots einfärben
function updateParticipants() {
  participants = [];
  for (let i = 0; i < 22; i++) {
    const val = document.getElementById(`participant-${i}`).value;
    const driver = ALL_DRIVERS.find(d => d.assetKey === val) || null;
    participants[i] = driver;

    const dot = document.getElementById(`pdot-${i}`);
    dot.style.background = driver ? (TEAM_COLORS[driver.team] || '#666') : '#333';
  }
}

// ── STARTAUFSTELLUNG TABELLE ──
function renderGridTable(drivers) {
  const tbody = document.getElementById('gridBody');
  tbody.innerHTML = '';

  drivers.forEach((d, i) => {
    const tr = document.createElement('tr');
    const logoSrc = d.team ? (TEAM_LOGOS[d.team] || '') : '';
    tr.innerHTML = `
      <td class="pos">${d.position}</td>
      <td>
        <select id="grid-select-${i}" onchange="applyGridDriver(${i}, this.value)">
          <option value="">— wählen —</option>
        </select>
      </td>
      <td id="grid-team-${i}" style="color:#aaa;font-size:0.9rem;padding:6px 8px;">${d.team || ''}</td>
      <td id="grid-num-${i}"  style="color:#aaa;font-size:0.9rem;padding:6px 8px;">${d.number || ''}</td>
      <td id="grid-key-${i}"  style="color:#555;font-size:0.85rem;padding:6px 8px;">${d.assetKey || ''}</td>
      <td><img class="preview-img" src="${logoSrc}" onerror="this.style.display='none'" style="${logoSrc ? '' : 'display:none'}" alt=""></td>
    `;
    tbody.appendChild(tr);
  });

  updateGridDropdowns();
}

// Dropdowns in der Startaufstellung mit aktuellen Teilnehmern befüllen
function updateGridDropdowns() {
  updateParticipants();
  const activeParts = participants.filter(p => p !== null);

  for (let i = 0; i < currentGrid.length; i++) {
    const sel = document.getElementById(`grid-select-${i}`);
    if (!sel) continue;
    const currentKey = currentGrid[i].assetKey;
    sel.innerHTML = `<option value="">— wählen —</option>`;
    activeParts.forEach(d => {
      sel.innerHTML += `<option value="${d.assetKey}" ${d.assetKey === currentKey ? 'selected' : ''}>${d.name}</option>`;
    });
  }
}

function applyGridDriver(index, assetKey) {
  if (!assetKey) {
    // Leer → alles zurücksetzen
    currentGrid[index] = { ...currentGrid[index], name: '', team: '', number: '', assetKey: '' };
    document.getElementById(`grid-team-${index}`).textContent = '';
    document.getElementById(`grid-num-${index}`).textContent  = '';
    document.getElementById(`grid-key-${index}`).textContent  = '';
    // Logo verstecken
    const img = document.querySelector(`#gridBody tr:nth-child(${index+1}) img`);
    if (img) img.style.display = 'none';
    return;
  }

  const driver = ALL_DRIVERS.find(d => d.assetKey === assetKey);
  if (!driver) return;
  currentGrid[index] = { ...currentGrid[index], ...driver };

  document.getElementById(`grid-team-${index}`).textContent = driver.team;
  document.getElementById(`grid-num-${index}`).textContent  = driver.number;
  document.getElementById(`grid-key-${index}`).textContent  = driver.assetKey;

  // Logo anzeigen
  const img = document.querySelector(`#gridBody tr:nth-child(${index+1}) img`);
  if (img) {
    img.src = TEAM_LOGOS[driver.team] || '';
    img.style.display = '';
  }
}

function updateGridField(index, field, value) {
  currentGrid[index][field] = value;
}

// ── LADEN ──
async function loadGrid() {
  try {
    const res  = await fetch(`${API_URL}/api/grid?t=${Date.now()}`);
    const data = await res.json();

    document.getElementById('raceName').value = data.race || '';

    // Teilnehmer laden falls gespeichert
    if (data.participants) {
      data.participants.forEach((key, i) => {
        const sel = document.getElementById(`participant-${i}`);
        if (sel && key) sel.value = key;
      });
      updateParticipants();
    }

    currentGrid = data.drivers || [];
    renderGridTable(currentGrid);

    if (data.updatedAt) {
      document.getElementById('lastSaved').textContent =
        `Zuletzt: ${new Date(data.updatedAt).toLocaleString('de-DE')}`;
    }
  } catch(err) {
    showStatus('Fehler beim Laden: ' + err.message, 'error');
  }
}

// ── SPEICHERN ──
async function saveGrid() {
  updateParticipants();

  const payload = {
    race:         document.getElementById('raceName').value,
    participants: participants.map(p => p ? p.assetKey : null),
    drivers:      currentGrid,
  };

  try {
    const res  = await fetch(`${API_URL}/api/grid`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await res.json();

    await fetch(`${API_URL}/api/replay`, { method: 'POST' });

    showStatus('✅ Gespeichert! Overlay & Intro werden aktualisiert.', 'success');
    document.getElementById('lastSaved').textContent =
      `Zuletzt: ${new Date(data.updatedAt).toLocaleString('de-DE')}`;
  } catch(err) {
    showStatus('Fehler: ' + err.message, 'error');
  }
}

function showStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = `status ${type}`;
  setTimeout(() => el.className = 'status', 5000);
}

// ── INIT ──
async function init() {
  currentGrid = Array.from({ length: 22 }, (_, i) => ({
    position: i + 1, name: '', team: '', number: '', assetKey: ''
  }));

  await loadDriverPool();
  buildParticipantsUI();
  renderGridTable(currentGrid);
  loadGrid();
}

init();
</script>
</body>
</html>
