<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>F1 Starting Grid Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Barlow:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1920px;
      height: 1080px;
      background: transparent;
      overflow: hidden;
      font-family: 'Barlow Condensed', sans-serif;
    }

    /* ── ROOT SCENE ── */
    #scene {
      position: absolute;
      inset: 0;
      display: flex;
      background: #0c0c14;
    }

    /* ── LEFT DRIVER PANEL ── */
    .driver-panel {
      position: relative;
      width: 580px;
      height: 1080px;
      flex-shrink: 0;
      overflow: hidden;
    }

    /* Diagonal stripe texture overlay */
    .driver-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 2;
      background: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 8px,
        rgba(0,0,0,0.07) 8px,
        rgba(0,0,0,0.07) 9px
      );
      pointer-events: none;
    }

    .panel-portrait {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      opacity: 0;
      transform: scale(1.04);
      transition: opacity 1.2s ease, transform 2s ease;
    }
    .panel-portrait.show {
      opacity: 1;
      transform: scale(1);
    }

    /* Gradient overlays on portrait */
    .panel-gradient-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 55%;
      background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.4) 60%, transparent 100%);
      z-index: 3;
    }
    .panel-gradient-inner {
      position: absolute;
      top: 0; bottom: 0;
      width: 120px;
      z-index: 3;
    }
    .panel-left .panel-gradient-inner  { right: 0; background: linear-gradient(to left,  rgba(10,10,18,0.85) 0%, transparent 100%); }
    .panel-right .panel-gradient-inner { left:  0; background: linear-gradient(to right, rgba(10,10,18,0.85) 0%, transparent 100%); }

    /* Team name vertical */
    .team-vertical {
      position: absolute;
      top: 50%;
      transform: translateY(-50%) rotate(-90deg);
      z-index: 5;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.22);
      white-space: nowrap;
      opacity: 0;
      transition: opacity 1s ease 0.6s;
    }
    .panel-left  .team-vertical { right: 18px;  transform: translateY(-50%) rotate(90deg); }
    .panel-right .team-vertical { left:  18px;  transform: translateY(-50%) rotate(-90deg); }
    .team-vertical.show { opacity: 1; }

    /* Team logo bottom corner */
    .team-logo-corner {
      position: absolute;
      bottom: 220px;
      z-index: 6;
      width: 60px;
      height: 60px;
      object-fit: contain;
      opacity: 0;
      transition: opacity 0.8s ease 1s;
    }
    .panel-left  .team-logo-corner { right: 40px; }
    .panel-right .team-logo-corner { left:  40px; }
    .team-logo-corner.show { opacity: 0.6; }

    /* Position number big */
    .panel-position {
      position: absolute;
      z-index: 6;
      bottom: 200px;
      font-weight: 900;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.6s ease 0.8s, transform 0.6s ease 0.8s;
      transform: translateY(20px);
    }
    .panel-left  .panel-position { left: 50px; }
    .panel-right .panel-position { right: 50px; text-align: right; }
    .panel-position.show { opacity: 1; transform: translateY(0); }

    .pos-ordinal {
      font-size: 72px;
      color: #ffffff;
      display: inline-block;
      line-height: 1;
    }
    .pos-suffix {
      font-size: 32px;
      color: rgba(255,255,255,0.7);
      vertical-align: super;
      margin-left: 2px;
    }

    /* Driver name bottom */
    .panel-name {
      position: absolute;
      bottom: 80px;
      z-index: 6;
      opacity: 0;
      transition: opacity 0.7s ease 1s, transform 0.7s ease 1s;
      transform: translateY(16px);
    }
    .panel-left  .panel-name { left: 0; right: 0; padding: 0 40px; }
    .panel-right .panel-name { left: 0; right: 0; padding: 0 40px; text-align: right; }
    .panel-name.show { opacity: 1; transform: translateY(0); }

    .name-first {
      font-family: 'Barlow Condensed', sans-serif;
      font-style: italic;
      font-size: 28px;
      font-weight: 400;
      color: rgba(255,255,255,0.7);
      letter-spacing: 1px;
      display: block;
      margin-bottom: 2px;
    }

    .name-last {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 68px;
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -1px;
      display: block;
      text-transform: uppercase;
    }

    /* ── CENTER COLUMN ── */
    #center {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 10;
    }

    /* F1 Logo top */
    #f1-logo {
      margin-top: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    #f1-logo.show { opacity: 1; }

    #f1-logo-bar {
      width: 4px;
      height: 40px;
      background: #e10600;
    }
    #f1-logo-text {
      font-size: 11px;
      letter-spacing: 5px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
    }

    /* Center red divider line */
    #center-line {
      position: absolute;
      top: 0; bottom: 0;
      left: 50%;
      width: 3px;
      background: linear-gradient(to bottom, transparent 0%, #e10600 15%, #e10600 85%, transparent 100%);
      transform: translateX(-50%);
    }

    /* "STARTING GRID" vertical text */
    #starting-grid-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(90deg);
      font-size: 11px;
      letter-spacing: 6px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      white-space: nowrap;
      z-index: 2;
    }

    /* Grid slot lists */
    #slots-left, #slots-right {
      position: absolute;
      display: flex;
      flex-direction: column;
      gap: 5px;
      top: 90px;
    }
    #slots-left  { right: calc(50% + 20px); align-items: flex-end; }
    #slots-right { left:  calc(50% + 20px); align-items: flex-start; }

    /* ── GRID SLOT ── */
    .slot {
      height: 40px;
      width: 160px;
      display: flex;
      align-items: center;
      gap: 0;
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    #slots-left  .slot { transform: translateX(12px); flex-direction: row-reverse; }
    #slots-right .slot { transform: translateX(-12px); }
    .slot.reveal { opacity: 1; transform: translateX(0); }

    /* Empty slot (not yet revealed) */
    .slot-empty {
      height: 40px;
      width: 160px;
      border: 1px solid rgba(255,255,255,0.1);
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .slot-empty.show { opacity: 1; }

    .slot-pos {
      width: 30px;
      height: 40px;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: rgba(255,255,255,0.6);
      flex-shrink: 0;
    }

    .slot-team-logo {
      width: 22px;
      height: 22px;
      object-fit: contain;
      flex-shrink: 0;
      margin: 0 5px;
    }

    .slot-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 0 8px;
      height: 40px;
      display: flex;
      align-items: center;
      flex: 1;
      border-top: 1px solid rgba(255,255,255,0.08);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    /* Current featured drivers P1/P2 get bigger slot */
    .slot.featured {
      display: none; /* hidden – they show as full panels */
    }

    /* ── RACE NAME bottom center ── */
    #race-label {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    #race-label.show { opacity: 1; }
    #race-label-sub {
      font-size: 10px;
      letter-spacing: 5px;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      margin-bottom: 2px;
    }
    #race-label-name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
    }

  </style>
</head>
<body>
<div id="scene">

  <!-- LEFT DRIVER PANEL (odd positions / P1) -->
  <div class="driver-panel panel-left" id="panel-left">
    <img class="panel-portrait" id="portrait-left" src="" alt="">
    <div class="panel-gradient-bottom"></div>
    <div class="panel-gradient-inner"></div>
    <div class="team-vertical" id="team-left">—</div>
    <img class="team-logo-corner" id="logo-left" src="" alt="">
    <div class="panel-position" id="pos-left">
      <span class="pos-ordinal" id="pos-left-num">—</span><sup class="pos-suffix" id="pos-left-sfx"></sup>
    </div>
    <div class="panel-name" id="name-left">
      <span class="name-first" id="name-left-first"></span>
      <span class="name-last" id="name-left-last" style="color:#fff">—</span>
    </div>
  </div>

  <!-- CENTER -->
  <div id="center">
    <div id="center-line"></div>
    <div id="starting-grid-label">Starting Grid</div>

    <div id="f1-logo">
      <div id="f1-logo-bar"></div>
      <div id="f1-logo-text">Formula 1 · 2026</div>
    </div>

    <!-- Left slots (odd: P1,P3,P5...) -->
    <div id="slots-left"></div>
    <!-- Right slots (even: P2,P4,P6...) -->
    <div id="slots-right"></div>

    <div id="race-label">
      <div id="race-label-sub">Grand Prix</div>
      <div id="race-label-name">—</div>
    </div>
  </div>

  <!-- RIGHT DRIVER PANEL (even positions / P2) -->
  <div class="driver-panel panel-right" id="panel-right">
    <img class="panel-portrait" id="portrait-right" src="" alt="">
    <div class="panel-gradient-bottom"></div>
    <div class="panel-gradient-inner"></div>
    <div class="team-vertical" id="team-right">—</div>
    <img class="team-logo-corner" id="logo-right" src="" alt="">
    <div class="panel-position" id="pos-right">
      <span class="pos-ordinal" id="pos-right-num">—</span><sup class="pos-suffix" id="pos-right-sfx"></sup>
    </div>
    <div class="panel-name" id="name-right">
      <span class="name-first" id="name-right-first"></span>
      <span class="name-last" id="name-right-last" style="color:#fff">—</span>
    </div>
  </div>

</div>

<script>
const API_URL    = 'https://f1-intro-api.onrender.com';
const GITHUB_RAW = 'https://raw.githubusercontent.com/zCrazMaex/F1_Intro/main/assets/drivers';
const GITHUB_RAW_TEAMS = 'https://raw.githubusercontent.com/zCrazMaex/F1_Intro/main/assets/teams';

const TEAM_LOGOS = {
  'Red Bull Racing': `${GITHUB_RAW_TEAMS}/redbull.png`,
  'McLaren':         `${GITHUB_RAW_TEAMS}/mclaren.png`,
  'Ferrari':         `${GITHUB_RAW_TEAMS}/ferrari.png`,
  'Mercedes':        `${GITHUB_RAW_TEAMS}/mercedes.png`,
  'Aston Martin':    `${GITHUB_RAW_TEAMS}/astonmartin.png`,
  'Alpine':          `${GITHUB_RAW_TEAMS}/alpine.png`,
  'Audi':            `${GITHUB_RAW_TEAMS}/audi.png`,
  'Williams':        `${GITHUB_RAW_TEAMS}/williams.png`,
  'VCARB':           `${GITHUB_RAW_TEAMS}/vcarb.png`,
  'Haas':            `${GITHUB_RAW_TEAMS}/haas.png`,
  'Cadillac':        `${GITHUB_RAW_TEAMS}/cadillac.png`,
};

/* Team colours for name + slot background */
const TEAM_COLORS = {
  'Red Bull Racing': '#3671C6',
  'McLaren':         '#FF8000',
  'Ferrari':         '#E8002D',
  'Mercedes':        '#27F4D2',
  'Aston Martin':    '#229971',
  'Alpine':          '#FF87BC',
  'Audi':            '#C92D4B',
  'Williams':        '#64C4FF',
  'VCARB':           '#6692FF',
  'Haas':            '#B6BABD',
  'Cadillac':        '#CC1E4A',
};

/* Short 3-letter codes */
const DRIVER_CODES = {
  // bestehende...
  'verstappen':'VER', 'lawson':'LAW', 'norris':'NOR', 'piastri':'PIA',
  'leclerc':'LEC',    'hamilton':'HAM','russell':'RUS','antonelli':'ANT',
  'alonso':'ALO',     'stroll':'STR',  'gasly':'GAS',  'doohan':'DOO',
  'hulkenberg':'HUL', 'bortoleto':'BOR','sainz':'SAI', 'albon':'ALB',
  'tsunoda':'TSU',    'hadjar':'HAD',  'ocon':'OCO',   'bearman':'BEA',
  'herta':'HER',      'drugovich':'DRU',
  // Deine Liga-Fahrer ← hier ergänzen
  'zcrazmaex':'ZCM',
  'fahrer2':'FA2',
};

function ordinalSuffix(n) {
  if (n === 1) return 'ST';
  if (n === 2) return 'ND';
  if (n === 3) return 'RD';
  return 'TH';
}

function splitName(full) {
  const parts = full.trim().split(' ');
  if (parts.length < 2) return { first: '', last: full };
  const last = parts.pop();
  return { first: parts.join(' '), last };
}

function teamColor(team) { return TEAM_COLORS[team] || '#e10600'; }
function driverCode(key) { return (DRIVER_CODES[key] || key.slice(0,3)).toUpperCase(); }

/* ── BUILD EMPTY SLOTS ── */
function buildSlots(drivers) {
  const slotL = document.getElementById('slots-left');
  const slotR = document.getElementById('slots-right');
  slotL.innerHTML = '';
  slotR.innerHTML = '';

  const sorted = [...drivers].sort((a,b) => a.position - b.position);

  sorted.forEach(d => {
    const isLeft = d.position % 2 === 1;
    const container = isLeft ? slotL : slotR;

    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.id = `slot-p${d.position}`;

    const color = teamColor(d.team);
    const code  = driverCode(d.assetKey);
    const logoSrc = TEAM_LOGOS[d.team] || '';

    // Slot inner: [pos] [team-logo] [name]
    slot.innerHTML = `
      <div class="slot-pos">${d.position}</div>
      <img class="slot-team-logo" src="${logoSrc}" onerror="this.style.display='none'" alt="">
      <div class="slot-name" style="color:${color}">${code}</div>
    `;
    container.appendChild(slot);
  });
}

/* ── SHOW FEATURED DRIVERS in side panels ── */
let currentFeaturedPositions = [];

function showPanelDrivers(posLeft, posRight, drivers) {
  const dLeft  = drivers.find(d => d.position === posLeft);
  const dRight = drivers.find(d => d.position === posRight);
  updatePanel('left',  dLeft);
  updatePanel('right', dRight);
}

function updatePanel(side, driver) {
  const portrait = document.getElementById(`portrait-${side}`);
  const team     = document.getElementById(`team-${side}`);
  const logo     = document.getElementById(`logo-${side}`);
  const posNum   = document.getElementById(`pos-${side}-num`);
  const posSfx   = document.getElementById(`pos-${side}-sfx`);
  const nameFirst= document.getElementById(`name-${side}-first`);
  const nameLast = document.getElementById(`name-${side}-last`);
  const panelName= document.getElementById(`name-${side}`);
  const panelPos = document.getElementById(`pos-${side}`);
  const panelTeam= document.getElementById(`team-${side}`);
  const panelLogo= document.getElementById(`logo-${side}`);

  // Hide first
  portrait.classList.remove('show');
  panelName.classList.remove('show');
  panelPos.classList.remove('show');
  panelTeam.classList.remove('show');
  panelLogo.classList.remove('show');

  if (!driver) return;

  const { first, last } = splitName(driver.name);
  const color = teamColor(driver.team);

  portrait.src = `${GITHUB_RAW}/${driver.assetKey}/portrait.png`;
  portrait.onerror = () => { portrait.style.opacity = 0; };
  logo.src = TEAM_LOGOS[driver.team] || '';

  team.textContent = driver.team;
  posNum.textContent = driver.position;
  posSfx.textContent = ordinalSuffix(driver.position);
  nameFirst.textContent = first;
  nameLast.textContent  = last.toUpperCase();
  nameLast.style.color  = color;

  // Staggered reveal
  setTimeout(() => portrait.classList.add('show'),  50);
  setTimeout(() => panelTeam.classList.add('show'), 400);
  setTimeout(() => panelLogo.classList.add('show'), 600);
  setTimeout(() => panelPos.classList.add('show'),  700);
  setTimeout(() => panelName.classList.add('show'), 850);
}

/* ── REVEAL ANIMATION ── */
let revealInterval = null;

function startReveal(drivers) {
  document.getElementById('f1-logo').classList.add('show');
  document.getElementById('race-label').classList.add('show');

  // Sequence: P22+P21 → P20+P19 → ... → P12+P11 → PAUSE → P10+P9 → ... → P2+P1
  const backPairs  = [];
  const frontPairs = [];
  for (let i = 22; i >= 11; i -= 2) backPairs.push([i, i-1]);
  for (let i = 10; i >= 1;  i -= 2) frontPairs.push([i, i-1]);

  const allSteps = [...backPairs, null, ...frontPairs];
  let step = 0;

  // Start with featured = last pair (P22+P21)
  currentFeaturedPositions = [22, 21];

  revealInterval = setInterval(() => {
    if (step >= allSteps.length) {
      clearInterval(revealInterval);
      revealInterval = null;
      return;
    }

    const pair = allSteps[step];
    step++;

    if (pair === null) {
      // Pause tick – hide panels briefly, then show P10+P9 coming up
      return;
    }

    const [posOdd, posEven] = pair[0] % 2 === 1 ? [pair[0], pair[1]] : [pair[1], pair[0]];

    // Reveal slot cards in center
    [pair[0], pair[1]].forEach(pos => {
      const el = document.getElementById(`slot-p${pos}`);
      if (el) el.classList.add('reveal');
    });

    // Update featured driver panels (latest revealed pair)
    currentFeaturedPositions = [posOdd, posEven];
    showPanelDrivers(posOdd, posEven, drivers);

  }, 2000);
}

/* ── RESTART ── */
function restartOverlay(data) {
  if (revealInterval) { clearInterval(revealInterval); revealInterval = null; }

  // Reset panels
  ['left','right'].forEach(side => {
    ['portrait','team','logo'].forEach(id => {
      const el = document.getElementById(`${id}-${side}`);
      if (el) el.classList.remove('show');
    });
    document.getElementById(`pos-${side}`)?.classList.remove('show');
    document.getElementById(`name-${side}`)?.classList.remove('show');
  });

  document.getElementById('f1-logo').classList.remove('show');
  document.getElementById('race-label').classList.remove('show');

  // Reset slots
  document.querySelectorAll('.slot').forEach(el => el.classList.remove('reveal'));

  // Set race name
  document.getElementById('race-label-name').textContent = data.race;

  // Rebuild slots
  buildSlots(data.drivers);

  // Start reveal after short delay
  setTimeout(() => startReveal(data.drivers), 700);
}

/* ── POLLING ── */
let lastReplayAt = null;

async function checkForUpdates() {
  try {
    const res  = await fetch(`${API_URL}/api/grid?t=${Date.now()}`);
    const data = await res.json();
    if (data.replayAt && data.replayAt !== lastReplayAt) {
      lastReplayAt = data.replayAt;
      restartOverlay(data);
    }
  } catch(e) { console.error(e); }
}

/* ── INIT ── */
async function init() {
  try {
    const res  = await fetch(`${API_URL}/api/grid?t=${Date.now()}`);
    const data = await res.json();
    lastReplayAt = data.replayAt || null;
    document.getElementById('race-label-name').textContent = data.race;
    buildSlots(data.drivers);
    setTimeout(() => startReveal(data.drivers), 800);
  } catch(e) { console.error('Init:', e); }
}

init();
setInterval(checkForUpdates, 5000);
</script>
</body>
</html>
